[package]
name = "recircles"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
description = "A radial file picker, application launcher and window switcher for Wayland"
license = "GPL-3.0-only"

[dependencies]
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
pangocairo = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
